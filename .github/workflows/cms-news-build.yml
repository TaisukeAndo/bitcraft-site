name: CMS News Build

# cms/worker (Cloudflare Workers上のMCPサーバー) の publish_news tool から
# workflow_dispatch で起動される。DBのpublished news全件から news/以下と
# index.htmlの#newsセクションを再生成し、レビュー用のPull Requestを自動作成する。
# mainへの直接pushは行わない（release-pr Skillのレビューを必ず経由させるため）。
#
# 事前準備（cms/README.md参照）:
#   - リポジトリSecrets: CF_ACCOUNT_ID, CF_D1_DATABASE_ID, CF_API_TOKEN
#   - Settings > Actions > General > Workflow permissions で
#     "Allow GitHub Actions to create and approve pull requests" を有効化

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "cms/worker側で発行されたpublish_requests.id（トレース用、省略可）"
        required: false
      slugs:
        description: "今回publishされたnews slug（カンマ区切り。smoke test対象、省略可）"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build news pages from D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node cms/build/build.mjs

      - name: Smoke test changed slugs
        if: ${{ github.event.inputs.slugs != '' }}
        run: |
          IFS=',' read -ra SLUGS <<< "${{ github.event.inputs.slugs }}"
          for slug in "${SLUGS[@]}"; do
            echo "::group::check_news.sh $slug"
            bash .claude/skills/add-news/scripts/check_news.sh "$slug"
            echo "::endgroup::"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "cms: news自動ビルド (request #${{ github.event.inputs.request_id }})"
          branch: cms/news-build-${{ github.run_id }}
          title: "[CMS] news自動ビルド反映 (request #${{ github.event.inputs.request_id }})"
          body: |
            MCP経由のニュース公開操作 (`publish_news`) によって自動生成されたPRです。

            - request_id: ${{ github.event.inputs.request_id }}
            - 対象slug: ${{ github.event.inputs.slugs }}

            マージ前に必ず生成されたHTMLの差分を確認し、`release-pr` Skillの安全確認
            （Draft/コンフリクト/openでない/base≠mainのチェック）を経由してからマージしてください。
            このPRはmainへ自動mergeしません。
          labels: cms-generated
