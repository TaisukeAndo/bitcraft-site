name: Terraform Plan

# terraform/**の変更に対して`terraform plan`結果をPRコメントとして投稿する
# （実装計画7章）。applyはしない（それはdeploy.yml、push:mainのみ）。
on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # cloudflareプロバイダの認証（providerブロックを持たず、この環境変数を暗黙に読む）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2をS3互換バックエンドとして使うための認証情報（terraform/backend.tf参照）。
      # アカウント全体のCLOUDFLARE_API_TOKENとは別物で、bitcraft-tfstateバケットのみに
      # 限定したR2専用トークン。
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Save plan output as text
        if: always()
        run: terraform show -no-color tfplan > plan.txt || echo "(plan failed. See the job log for details.)" > plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let output = fs.readFileSync("terraform/plan.txt", "utf8");
            const MAX = 60000;
            if (output.length > MAX) {
              output = `(先頭を省略。全文はActionsのジョブログを参照)\n...\n` + output.slice(-MAX);
            }
            const body = `### Terraform Plan\n\`\`\`\n${output}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail the job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
