<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" width="1440" height="300">
  <rect width="1440" height="300" fill="#0a0a0f"/>
  <defs>
    <pattern id="heroGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#121218" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1440" height="300" fill="url(#heroGrid)"/>

  <!-- Binary streams -->
  <text font-family="monospace" font-size="11" fill="#151522">
    <tspan x="20" y="28">01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011</tspan>
    <tspan x="20" dy="22">10110110 11010110 10110110 11010110 10110110 11010110 10110110 11010110 10110110</tspan>
    <tspan x="20" dy="22">01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011</tspan>
    <tspan x="20" dy="22">11010101 10110101 11010101 10110101 11010101 10110101 11010101 10110101 11010101</tspan>
    <tspan x="20" dy="22">01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011</tspan>
    <tspan x="20" dy="22">10110101 11010110 10110101 11010110 10110101 11010110 10110101 11010110 10110101</tspan>
    <tspan x="20" dy="22">01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011 01101011</tspan>
    <tspan x="20" dy="22">11010110 10110110 11010110 10110110 11010110 10110110 11010110 10110110 11010110</tspan>
  </text>

  <!-- Shield (right side) -->
  <path d="M1200,40 L1280,75 L1280,175 Q1280,250 1200,280 Q1120,250 1120,175 L1120,75 Z"
        fill="none" stroke="#252535" stroke-width="2.5"/>
  <path d="M1200,55 L1268,87 L1268,178 Q1268,245 1200,270 Q1132,245 1132,178 L1132,87 Z"
        fill="#0d0d18" stroke="#1e1e30" stroke-width="1"/>
  <!-- Check in shield -->
  <path d="M1172,168 L1192,192 L1232,142"
        fill="none" stroke="#303050" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connecting lines from shield -->
  <line x1="1120" y1="160" x2="1060" y2="160" stroke="#1e1e30" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1060" y1="160" x2="1060" y2="100" stroke="#1e1e30" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1060" y1="100" x2="980" y2="100" stroke="#1e1e30" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Node dots -->
  <circle cx="1060" cy="160" r="3" fill="#252535"/>
  <circle cx="1060" cy="100" r="3" fill="#252535"/>
  <circle cx="980" cy="100" r="3" fill="#252535"/>

  <!-- Label node -->
  <rect x="880" y="88" width="100" height="24" rx="2" fill="#0f0f1e" stroke="#252535" stroke-width="1"/>
  <text x="930" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#353555">PROTECTED</text>

  <!-- Left vertical accent line -->
  <line x1="60" y1="30" x2="60" y2="270" stroke="#1e1e30" stroke-width="1"/>
  <circle cx="60" cy="60" r="3" fill="#252535"/>
  <circle cx="60" cy="150" r="3" fill="#252535"/>
  <circle cx="60" cy="240" r="3" fill="#252535"/>
</svg>
